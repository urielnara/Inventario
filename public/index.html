<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(90deg, #323232, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            color: #000000;
        }

        .login-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e7f0ff;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 20px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }
        
        .form-label{
            color: #000000;
        }

        .btn-login {
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, .15);
        }
    </style>
</head>

<body>
    <div class="login-card">

        <div class="login-icon">
            <i class="bi bi-person-lock"></i>
        </div>

        <h2 class="text-center fw-bold mb-2">Bienvenido</h2>

        <p class="text-center text-secondary mb-4">
            Inicia sesión para continuar
        </p>

        <form id="loginForm">

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label black">
                    Correo electrónico
                </label>

                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@correo.com"
                    autocomplete="username" required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label black">
                    Contraseña
                </label>

                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
                </div>
            </div>

            <!-- Remember and forgot password -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">
                        Recordarme
                    </label>
                </div>

                <a href="#" id="forgotPassword" class="text-decoration-none small">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <!-- Login button -->
            <button type="submit" class="btn btn-primary w-100 btn-login">
                Iniciar sesión
            </button>

            <div id="message" class="mt-3" role="status" aria-live="polite"></div>

        </form>

        <hr class="my-4">

        <p class="text-center mb-0 text-secondary">
            ¿No tienes una cuenta?
            <a href="#" id="registerLink" class="text-decoration-none fw-semibold">
                Regístrate
            </a>
        </p>

    </div>

    <script>
    </script>

</body>

</html>
