
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(90deg, #323232, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            color: #000000;
        }

        .register-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e7f0ff;
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 20px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }
        
        .form-label{
            color: #000000;
        }

        .btn-register {
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, .15);
        }
    </style>
</head>

<body>
    <main class="register-card">
        <div class="register-icon">
            <i class="bi bi-person-lock"></i>
        </div>

        <h2 class="text-center fw-bold mb-2">Registro</h2>

        <p class="text-center text-secondary mb-4">
            Añade tus credenciales para registrarte
        </p>

        <form id="registerForm">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre de usuario</label>
                <input type="text" class="form-control" id="nombre"
                    name="nombre" placeholder="Juan Pérez"
                    maxlength="100" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email"
                    name="email" placeholder="nombre@correo.com"
                    maxlength="150" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password"
                    name="password" placeholder="Mínimo 8 caracteres"
                    minlength="8" maxlength="1024"
                    autocomplete="new-password" required>
            </div>

            <div class="mb-3">
                <label for="password_confirm" class="form-label">
                    Confirmar contraseña
                </label>
                <input type="password" class="form-control"
                    id="password_confirm" name="password_confirm"
                    placeholder="Confirma tu contraseña"
                    minlength="8" maxlength="1024"
                    autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-register">
                Registrarse
            </button>

            <div id="message" class="mt-3" role="status"
                aria-live="polite"></div>
        </form>

        <hr class="my-4">

        <p class="text-center mb-0 text-secondary">
            ¿Ya tienes una cuenta?
            <a href="index.html" class="text-decoration-none fw-semibold">
                Iniciar sesión
            </a>
        </p>
    </main>

    <script>
        const registerForm = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const button = registerForm.querySelector('button[type="submit"]');

        document.getElementById('password_confirm').addEventListener('input', () => {
            const password = document.getElementById('password');
            const confirm = document.getElementById('password_confirm');

            confirm.setCustomValidity(
                confirm.value && confirm.value !== password.value
                    ? 'Las contraseñas no coinciden.'
                    : ''
            );
        });

        document.getElementById('password').addEventListener('input', () => {
            const password = document.getElementById('password');
            const confirm = document.getElementById('password_confirm');

            confirm.setCustomValidity(
                confirm.value && confirm.value !== password.value
                    ? 'Las contraseñas no coinciden.'
                    : ''
            );
        });

        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            message.replaceChildren();
            message.className = 'mt-3';

            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password_confirm =
                document.getElementById('password_confirm').value;

            if (password !== password_confirm) {
                message.className = 'alert alert-danger mt-3';
                message.textContent = 'Las contraseñas no coinciden.';
                return;
            }

            button.disabled = true;
            button.textContent = 'Registrando...';

            try {
                const response = await fetch('../api/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        nombre,
                        email,
                        password,
                        password_confirm
                    })
                });

                const result = await response.json().catch(() => null);

                if (!response.ok || !result || !result.success) {
                    throw new Error(
                        result?.message ||
                        `Error del servidor (${response.status}).`
                    );
                }

                message.className = 'alert alert-success mt-3';
                message.textContent =
                    '¡Registro exitoso! Redirigiendo al inicio de sesión...';

                registerForm.reset();

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);

            } catch (error) {
                message.className = 'alert alert-danger mt-3';
                message.textContent =
                    error.message || 'No se pudo conectar con el servidor.';
            } finally {
                button.disabled = false;
                button.textContent = 'Registrarse';
            }
        });
    </script>
</body>

</html>
